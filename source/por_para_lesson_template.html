<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Por y para | SPN 213 MT slides</title>
<style>
:root{--blue:#15579f;--red:#b93037;--ink:#1f2937;--muted:#67778a;--line:#e5eaf0;--background:#fff}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;width:100%;min-height:100%;background:var(--background);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{min-height:100svh;min-height:100dvh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:14px clamp(20px,4.5vw,70px) 12px;min-height:52px;color:#7d8795;font-size:clamp(12px,1.05vw,15px);font-weight:600;letter-spacing:.085em}
#progress{height:3px;flex:none;background:#eff2f6}
#progressbar{height:100%;background:var(--blue);width:0;transition:width .12s linear}
main{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;padding:clamp(18px,4vh,48px) clamp(22px,5vw,78px)}
.slide{width:100%;max-width:1260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:clamp(19px,3vh,32px)}
.kicker{font-size:clamp(17px,1.55vw,23px);letter-spacing:.09em;text-transform:uppercase;color:#7c8796;font-weight:700}
.use-prep{font-size:clamp(40px,5vw,80px);line-height:1.12;color:var(--blue);font-weight:700;letter-spacing:-.028em}
.use-title{font-size:clamp(43px,5.1vw,76px);line-height:1.16;color:var(--ink);font-weight:600;letter-spacing:-.032em;text-wrap:balance}
.use-gloss{font-size:clamp(26px,3.1vw,44px);line-height:1.26;color:var(--muted);text-wrap:balance}
.english{font-size:clamp(38px,4.85vw,68px);line-height:1.23;letter-spacing:-.024em;font-weight:500;color:var(--blue);text-wrap:balance;max-width:1200px}
.answer{font-size:clamp(37px,4.25vw,62px);line-height:1.24;letter-spacing:-.021em;font-weight:500;color:var(--red);text-wrap:balance;max-width:1200px}
.cue{font-size:clamp(24px,2.4vw,34px);color:#607184;line-height:1.32;text-wrap:balance;max-width:1200px}
.hintbox{max-width:1160px;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,1.6vh,18px);font-weight:400}
.hint{font-size:clamp(27px,2.45vw,38px);line-height:1.3;color:#566677;text-wrap:balance}
.vocab{font-size:clamp(27px,2.3vw,35px);line-height:1.3;color:#718096;text-wrap:balance}
.mixed-title{font-size:clamp(50px,6vw,90px);color:var(--blue);font-weight:600;line-height:1.2;letter-spacing:-.03em}
.mixed-subtitle{font-size:clamp(32px,3.7vw,53px);color:var(--ink);line-height:1.25}
footer{flex:none;min-height:88px;display:flex;justify-content:center;align-items:center;gap:12px;padding:14px 24px 20px;border-top:1px solid #f4f6f8}
button{font-family:inherit;border:1px solid #dfe5ec;color:#46576a;background:#fff;border-radius:7px;min-height:46px;padding:9px 20px;font-size:17px;cursor:pointer}
button:hover{background:#f6f9fc}button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}button:disabled{opacity:.22;cursor:default}
#prev,#next{font-size:28px;padding:0;width:52px;line-height:1.0}
#reveal{color:var(--blue);border-color:#b9d1e9;min-width:170px}
#speak{padding:0;width:50px;font-size:21px}
#counter{font-size:17px;color:#7b8793;min-width:94px;text-align:center;font-variant-numeric:tabular-nums}
#fullscreen{margin-left:8px;font-size:19px;width:48px;padding:0}
@media (min-width:1500px){.english{font-size:clamp(57px,4.9vw,81px)}.answer{font-size:clamp(53px,4.3vw,74px)}.hint{font-size:clamp(28px,1.9vw,37px)}.vocab{font-size:clamp(26px,1.8vw,35px)}}
@media(max-width:700px){header{min-height:44px;padding:10px 20px;font-size:12px}main{padding:28px 20px}.slide{gap:23px}.use-prep{font-size:clamp(34px,8vw,48px)}.use-title{font-size:clamp(34px,8.2vw,53px)}.use-gloss{font-size:clamp(23px,5.4vw,34px)}.english{font-size:clamp(32px,7.9vw,49px)}.answer{font-size:clamp(30px,7.4vw,47px)}.cue{font-size:clamp(23px,5.9vw,34px)}.hint{font-size:clamp(21px,5.4vw,28px)}.vocab{font-size:clamp(20px,4.9vw,27px)}footer{min-height:80px;gap:8px;padding:10px 8px 16px}button{min-height:44px;font-size:14px;padding:8px 12px}#prev,#next{width:44px}#reveal{min-width:120px}#counter{min-width:63px;font-size:13px}#speak{width:43px;font-size:18px}#fullscreen{display:none}}
@media(max-height:650px) and (min-width:701px){main{padding-top:15px;padding-bottom:15px}.slide{gap:16px}.english{font-size:clamp(35px,4vw,54px)}.answer{font-size:clamp(32px,3.8vw,50px)}.hint,.vocab{font-size:24px}footer{min-height:66px;padding:7px 15px}}
@media(prefers-reduced-motion:reduce){#progressbar{transition:none}}
</style>
</head>
<body>
<header><span>SPN 213</span><span>POR Y PARA</span></header>
<div id="progress" aria-hidden="true"><div id="progressbar"></div></div>
<main>
<section class="slide" aria-live="polite" aria-atomic="true">
  <div id="kicker" class="kicker" hidden></div>
  <div id="usePrep" class="use-prep" hidden></div>
  <div id="useTitle" class="use-title" hidden></div>
  <div id="useGloss" class="use-gloss" hidden></div>
  <div id="english" class="english" hidden></div>
  <div id="cue" class="cue" hidden></div>
  <div id="answer" class="answer" hidden></div>
  <div id="hintbox" class="hintbox" hidden>
    <div id="hint" class="hint"></div>
    <div id="vocab" class="vocab"></div>
  </div>
  <div id="mixedTitle" class="mixed-title" hidden></div>
  <div id="mixedSubtitle" class="mixed-subtitle" hidden></div>
</section>
</main>
<footer>
  <button id="prev" aria-label="Previous slide" title="Previous slide (left arrow)">‹</button>
  <button id="reveal" title="Reveal answer (Space)">Reveal</button>
  <button id="next" aria-label="Next slide" title="Next slide (right arrow)">›</button>
  <button id="speak" aria-label="Read Spanish aloud" title="Read Spanish aloud">🔊</button>
  <span id="counter"></span>
  <button id="fullscreen" title="Fullscreen (F)" aria-label="Fullscreen">⛶</button>
</footer>
<script>
'use strict';
const SLIDES = __SLIDES_JSON__;
const q=(id)=>document.getElementById(id);
let i=0,visible=false;
function show(id,value){q(id).textContent=value ?? '';q(id).hidden=!value;}
function isAnswerSlide(s){return s.type==='practice'||s.type==='mixed';}
function render(){
  const s=SLIDES[i];
  for(const id of ['kicker','usePrep','useTitle','useGloss','english','cue','answer','hintbox','mixedTitle','mixedSubtitle'])q(id).hidden=true;
  if(s.type==='use'){
    show('usePrep',`${s.preposition.toUpperCase()} USE ${s.use_number}`);
    show('useTitle',s.title);
    show('useGloss',`(${s.gloss})`);
  }else if(s.type==='divider'){
    show('mixedTitle',s.title);
    show('mixedSubtitle',s.subtitle);
  }else{
    if(s.type==='model')show('kicker','EXAMPLE');
    if(s.type==='practice')show('kicker',`PRACTICE ${s.practice_number} / 3`);
    if(s.type==='mixed')show('kicker','MIXED PRACTICE');
    show('english',s.english);
    const answerVisible=s.type==='model'||visible;
    // Every unrevealed exercise includes a gray Spanish fill-in cue.
    if(!answerVisible&&s.cue)show('cue',s.cue);
    if(answerVisible)show('answer',s.spanish);
    // Every example and exercise includes vocabulary support.
    if(s.vocab){
      q('hintbox').hidden=false;
      if(s.type==='mixed')show('hint',`Use: ${s.hint_use||s.use}`);
      show('vocab',`Vocabulary: ${s.vocab}`);
    }
  }
  q('reveal').hidden=!isAnswerSlide(s);
  q('reveal').textContent=visible?'Hide answer':'Reveal';
  q('speak').hidden=!(s.spanish&&(s.type==='model'||visible));
  q('prev').disabled=i===0;
  q('next').disabled=i===SLIDES.length-1;
  q('counter').textContent=`${i+1} / ${SLIDES.length}`;
  q('progressbar').style.width=`${(i+1)/SLIDES.length*100}%`;
  // A hash enables direct links to specific classroom slides.
  const hash=`#${i+1}`;
  if(location.hash!==hash)history.replaceState(null,'',hash);
}
function step(n){let to=i+n;if(to<0||to>=SLIDES.length)return;i=to;visible=false;render();}
function toggle(){if(!isAnswerSlide(SLIDES[i]))return;visible=!visible;render();}
function speak(){
  const s=SLIDES[i];if(!s.spanish||!(s.type==='model'||visible)||!('speechSynthesis' in window))return;
  speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(s.spanish);utterance.lang='es-ES';utterance.rate=.86;speechSynthesis.speak(utterance);
}
function fullscreen(){if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();}else{document.exitFullscreen?.();}}
q('prev').addEventListener('click',()=>step(-1));
q('next').addEventListener('click',()=>step(1));
q('reveal').addEventListener('click',toggle);
q('speak').addEventListener('click',speak);
q('fullscreen').addEventListener('click',fullscreen);
document.addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key==='ArrowLeft'){e.preventDefault();step(-1);}
  else if(e.key==='ArrowRight'){e.preventDefault();step(1);}
  else if((e.key===' '||e.key==='Enter')&&!(e.target instanceof HTMLButtonElement)){
    e.preventDefault();if(isAnswerSlide(SLIDES[i])&&!visible)toggle();else step(1);
  }else if(e.key.toLowerCase()==='f'&&!(e.target instanceof HTMLButtonElement)){fullscreen();}
});
const initial=Number(location.hash.slice(1));if(Number.isInteger(initial)&&initial>=1&&initial<=SLIDES.length)i=initial-1;
render();
</script>
</body>
</html>
