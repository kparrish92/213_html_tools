<style>
:root{

*{box-sizing:border-box}
html,body{margin:0;min-width:320px;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#fff;color:var(--ink)}
button,select{font:inherit}

.screen.active{display:flex}
.lesson-title{color:var(--blue);font-size:clamp(1.05rem,1.9vw,1.3rem);font-weight:800;margin:0 0 1rem}
.stage-title{font-size:.84rem;font-weight:800;color:#687680;letter-spacing:.11em;text-transform:uppercase;margin:0 0 1rem;max-width:900px;line-height:1.35}
.prompt{color:var(--blue);font-weight:800;font-size:clamp(1.8rem,4vw,3.15rem);line-height:1.2;max-width:1080px;overflow-wrap:break-word}

.answer-en{color:var(--blue);font-weight:700;font-size:clamp(1.05rem,1.9vw,1.32rem);line-height:1.4;max-width:1000px;margin-bottom:1.6rem}

.target{border:0;background:transparent;color:inherit;font:inherit;line-height:inherit;cursor:pointer;text-decoration:underline dotted 2px;text-underline-offset:.18em;padding:0 .025em;border-radius:3px}
.target:hover{background:#eef3f8}
.target.flagged{background:#e8eef5;text-decoration-style:solid}
.review-target{color:var(--purple);background:var(--purple-bg);text-decoration:underline 2px;text-underline-offset:.18em;border-radius:3px;padding:0 .035em}
.hint{font-size:.85rem;color:#8b959d;line-height:1.5;max-width:850px;margin-top:1.2rem}
.review-hint{font-size:.82rem;color:var(--purple);margin-top:1.25rem}
#controls{position:fixed;top:12px;right:14px;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;align-items:center;z-index:10;max-width:calc(100vw - 80px)}
#controls select,#controls button{font-size:.78rem;color:#68737c;background:rgba(255,255,255,.97);border:1px solid #d7dde2;border-radius:7px;padding:.48em .6em;min-height:33px}
#controls button{font-weight:700;cursor:pointer}
#controls button:hover{border-color:#aeb8c0}
#controls #audio-toggle.on{color:var(--blue);border-color:#9fb2c7;background:#eef3f8}
.home{position:fixed;top:11px;left:15px;z-index:10;text-decoration:none;color:#98a1a7;font-size:.83rem;font-weight:800;border:1px solid #e4e8eb;border-radius:7px;padding:.58em .75em;background:white}
.home:hover{color:var(--blue);border-color:#bdcddc}
#progress{position:fixed;bottom:21px;left:50%;transform:translateX(-50%);color:var(--muted);font-size:.86rem;white-space:nowrap}
.nav{position:fixed;bottom:13px;border:0;background:transparent;color:#6f777e;font-weight:800;cursor:pointer;padding:.7em .9em;min-height:44px}
.nav:disabled{opacity:.25;cursor:default}
#back{left:14px}#next{right:14px}
.audio-button{margin-top:1.1rem;border:1px solid #d7dde2;background:white;color:#5f6b75;border-radius:999px;min-width:44px;min-height:39px;padding:.45em .75em;cursor:pointer}
.audio-button:hover{background:#f7f9fb;border-color:#aeb8c0}
.audio-button:disabled{opacity:.3;cursor:default}
.end-title{font-size:clamp(2rem,4vw,3rem);color:var(--blue);font-weight:800;margin-bottom:.55em}
.end-detail{color:#657078;line-height:1.5;max-width:600px;margin-bottom:1.5rem}
.end-controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.primary,.secondary{font-weight:800;border-radius:9px;padding:.8em 1.4em;cursor:pointer}
.primary{border:0;background:var(--blue);color:white}
.secondary{border:1px solid var(--blue);background:white;color:var(--blue)}
.flag-info{font-size:.84rem;color:#7c8891;margin-top:1.1rem}
@media(max-width:700px){
 .screen{padding:112px 7vw 100px}

 .cue{font-size:1rem}

 #progress{bottom:19px;font-size:.74rem}
}
</style>

const byId=Object.fromEntries(DATA.items.map(i=>[i.item_id,i]));
const byStage=Object.fromEntries(DATA.stages.map(s=>[s.stage_id,s]));
const mainItems=DATA.stages.flatMap(s=>s.main_ids.map(id=>byId[id]));
const controls=document.getElementById('controls');
const content=document.getElementById('content');
const progress=document.getElementById('progress');
const lessonScreen=document.getElementById('lesson-screen');
const endScreen=document.getElementById('end-screen');
const back=document.getElementById('back');
const next=document.getElementById('next');
const reviewBtn=document.getElementById('review');
let mode='lesson';
let lessonItems=[...mainItems];
let reviewItems=[];
let currentIndex=0;
let showingAnswer=false;
let flagged=new Set();
let autoAudio=false;
let preferredSpanishVoice=null;

function esc(x){return String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function shuffled(x){const a=[...x];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function currentArray(){return mode==='lesson'?lessonItems:reviewItems}
function current(){return currentArray()[currentIndex]}
function stopAudio(){if('speechSynthesis' in window)window.speechSynthesis.cancel()}
function chooseSpanishVoice(){
  if(!('speechSynthesis' in window))return null;
  const spanish=(window.speechSynthesis.getVoices()||[]).filter(v=>String(v.lang||'').toLowerCase().startsWith('es'));
  preferredSpanishVoice=spanish.find(v=>/^es-(mx|us|419)/i.test(v.lang))||spanish.find(v=>/^es-es/i.test(v.lang))||spanish[0]||null;
  return preferredSpanishVoice;
}
if('speechSynthesis' in window){chooseSpanishVoice();window.speechSynthesis.addEventListener?.('voiceschanged',chooseSpanishVoice)}
function speakSpanish(str){
  if(!str||!('speechSynthesis' in window))return;
  stopAudio();
  const u=new SpeechSynthesisUtterance(str);
  const voice=preferredSpanishVoice||chooseSpanishVoice();
  if(voice){u.voice=voice;u.lang=voice.lang}else{u.lang='es-MX'}
  u.rate=.92;u.pitch=1;
  window.speechSynthesis.speak(u);
}
function targetMarkup(span,stage,review){
  if(review)return `<span class="review-target">${esc(span)}</span>`;
  const selected=flagged.has(stage)?' flagged':'';
  return `<button type="button" class="target${selected}" data-stage="${esc(stage)}" aria-pressed="${flagged.has(stage)}" aria-label="Mark this grammar group for extra review" title="Click for two extra examples">${esc(span)}</button>`;
}
function renderAnswer(item,review){
  const sentence=item.spanish;
  const needle=item.target_span;
  const at=sentence.toLocaleLowerCase('es').indexOf(needle.toLocaleLowerCase('es'));
  if(at<0)return esc(sentence);
  return esc(sentence.slice(0,at))+targetMarkup(sentence.slice(at,at+needle.length),item.stage_id,review)+esc(sentence.slice(at+needle.length));
}
function stageLabel(item){
  if(mode==='review')return 'EXTRA REVIEW · '+byStage[item.stage_id].title;
  return byStage[item.stage_id].title;
}
function show(){
  const item=current();
  if(!item)return finish();
  const cue=`<div class="cue"><strong>Spanish cue:</strong> ${esc(item.infinitive)}</div>`;
  if(!showingAnswer){
    content.innerHTML=`<div class="stage-title">${esc(stageLabel(item))}</div><div class="prompt">${esc(item.english)}</div>${cue}`;
  }else{
    content.innerHTML=`<div class="stage-title">${esc(stageLabel(item))}</div>`+
      `<div class="answer-en">${esc(item.english)}</div>`+
      `<div class="answer-es">${renderAnswer(item,mode==='review')}</div>`+
      `<div class="cue">${esc(item.infinitive)}</div>`+
      (mode==='lesson'?'<div class="hint">Click the underlined command to add two new examples of this grammar group.</div>':'<div class="review-hint">Extra practice</div>');
    const b=document.createElement('button');b.className='audio-button';b.type='button';b.textContent='🔊';
    b.title='Play Spanish audio';b.setAttribute('aria-label','Play Spanish audio');
    b.disabled=!('speechSynthesis' in window);
    b.onclick=e=>{e.stopPropagation();speakSpanish(item.spanish)};
    content.appendChild(b);
    if(autoAudio)speakSpanish(item.spanish);
  }
  const num=currentIndex*2+(showingAnswer?2:1);
  progress.textContent=`${mode==='review'?'Review slide':'Slide'} ${num} / ${currentArray().length*2}`;
  back.disabled=currentIndex===0&&!showingAnswer;
  next.textContent=currentIndex===currentArray().length-1&&showingAnswer?'Finish →':'Next →';
  controls.style.display=mode==='review'?'none':'flex';
}
function forward(){
  stopAudio();
  if(!showingAnswer){showingAnswer=true;show();return}
  if(currentIndex<currentArray().length-1){currentIndex++;showingAnswer=false;show()}else finish();
}
function backward(){
  stopAudio();
  if(showingAnswer){showingAnswer=false;show();return}
  if(currentIndex>0){currentIndex--;showingAnswer=true;show()}
}
function filteredItems(){
  const focus=document.getElementById('focus').value;
  if(focus==='all')return mainItems;
  if(focus==='formal')return mainItems.filter(i=>i.stage_id.startsWith('UD'));
  if(focus==='tu')return mainItems.filter(i=>i.stage_id.startsWith('TU_'));
  if(focus==='vosotros')return mainItems.filter(i=>i.stage_id==='VOSOTROS');
  return mainItems.filter(i=>i.stage_id==='MIXED');
}
function drawSet(){
  const pool=filteredItems();
  const size=document.getElementById('subset-size').value;
  if(size==='all'||Number(size)>=pool.length)return [...pool];
  // As in the earlier subjunctive trainer, partial sets use a contiguous
  // segment so forms remain pedagogically grouped and scaffolded.
  const n=Number(size),start=Math.floor(Math.random()*(pool.length-n+1));
  return pool.slice(start,start+n);
}
function startNewSet(){
  stopAudio();mode='lesson';lessonItems=drawSet();reviewItems=[];
  currentIndex=0;showingAnswer=false;flagged=new Set();
  endScreen.classList.remove('active');lessonScreen.classList.add('active');show();
}
function finish(){
  stopAudio();lessonScreen.classList.remove('active');endScreen.classList.add('active');
  progress.textContent='';controls.style.display='flex';
  back.style.display='none';next.style.display='none';
  if(mode==='review'){
    document.getElementById('end-title').textContent='Extra review complete';
    document.getElementById('end-detail').textContent=`${reviewItems.length} additional examples completed.`;
    reviewBtn.style.display='none';
  }else{
    document.getElementById('end-title').textContent='Practice complete';
    document.getElementById('end-detail').textContent=flagged.size?`${flagged.size} grammar group${flagged.size===1?'':'s'} marked for extra practice.`:'No forms were marked for extra practice.';
    reviewBtn.style.display=flagged.size?'inline-block':'none';
    reviewBtn.textContent=`Extra review: ${flagged.size*2} items`;
  }
}
function startReview(){
  reviewItems=shuffled([...flagged].flatMap(stage=>byStage[stage].review_ids.map(id=>byId[id])));
  if(!reviewItems.length)return;
  stopAudio();mode='review';currentIndex=0;showingAnswer=false;
  endScreen.classList.remove('active');lessonScreen.classList.add('active');
  back.style.display='block';next.style.display='block';show();
}
function repeatSet(){
  stopAudio();mode='lesson';currentIndex=0;showingAnswer=false;flagged=new Set();
  endScreen.classList.remove('active');lessonScreen.classList.add('active');
  back.style.display='block';next.style.display='block';show();
}
function resetAndShow(){back.style.display='block';next.style.display='block';startNewSet()}
content.onclick=e=>{
  const b=e.target.closest('button.target');
  if(b){
    const id=b.dataset.stage;
    if(flagged.has(id))flagged.delete(id);else flagged.add(id);
    content.querySelectorAll('.target').forEach(t=>{t.classList.toggle('flagged',flagged.has(t.dataset.stage));t.setAttribute('aria-pressed',flagged.has(t.dataset.stage) ? 'true':'false')});
    return;
  }
  if(e.target.closest('.audio-button'))return;
  forward();
};
back.onclick=backward;next.onclick=forward;
document.getElementById('new-set').onclick=resetAndShow;
document.getElementById('new-set-end').onclick=resetAndShow;
document.getElementById('repeat').onclick=repeatSet;
reviewBtn.onclick=startReview;
document.getElementById('audio-toggle').onclick=()=>{
  autoAudio=!autoAudio;
  const b=document.getElementById('audio-toggle');b.textContent=autoAudio?'Audio: On':'Audio: Off';
  b.classList.toggle('on',autoAudio);b.setAttribute('aria-pressed',String(autoAudio));
  if(autoAudio&&showingAnswer&&lessonScreen.classList.contains('active'))speakSpanish(current().spanish);
  if(!autoAudio)stopAudio();
};
document.addEventListener('keydown',e=>{
  if(!lessonScreen.classList.contains('active'))return;
  if(e.target.closest('select,button,input,textarea,a'))return;
  if(['ArrowRight',' ','Enter'].includes(e.key)){e.preventDefault();forward()}
  else if(e.key==='ArrowLeft'){e.preventDefault();backward()}
});
show();
</script>
</body>
</html>
