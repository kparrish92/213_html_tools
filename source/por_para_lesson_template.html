<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Por y para · Lección 4</title>
<style>
:root {
  --blue: #355C8A;
  --red: #B33A3A;
  --purple: #7A5AA6;
  --purple-bg: #F1ECF7;
  --ink: #2b3035;
  --muted: #8a9299;
  --line: #e2e6e9;
  --soft: #f7f8fa;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; width: 100%; height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: white; color: var(--ink);
}
button, select, input { font: inherit; }
.screen {
  width: 100vw; height: 100vh;
  display: none; flex-direction: column;
  justify-content: center; align-items: center;
  text-align: center; padding: 7vh 8vw 12vh;
}
.screen.active { display: flex; }
.title {
  color: var(--blue); font-size: 3rem; font-weight: 800;
  line-height: 1.08; margin-bottom: .6em;
}
.subtitle {
  color: #66717a; max-width: 780px; line-height: 1.5;
  margin-bottom: 1.5em;
}
.primary {
  border: 0; background: var(--blue); color: white;
  font-weight: 800; border-radius: 9px; padding: .8em 1.4em;
  cursor: pointer;
}
.secondary {
  border: 1px solid var(--blue); background: white; color: var(--blue);
  font-weight: 800; border-radius: 9px; padding: .72em 1.2em;
  cursor: pointer;
}
.prompt {
  color: var(--blue); font-size: 3rem; font-weight: 800;
  line-height: 1.25; max-width: 1050px;
}
.answer-en {
  color: var(--blue); font-size: 1.35rem; font-weight: 650;
  margin-bottom: 1em; max-width: 1000px; line-height: 1.3;
}
.answer-es {
  color: var(--red); font-size: 2.75rem; font-weight: 800;
  line-height: 1.28; max-width: 1100px;
}
.target {
  text-decoration: underline dotted 2px;
  text-underline-offset: .18em; cursor: pointer;
  border-radius: .13em; padding: 0 .03em;
}
.target.flagged {
  text-decoration-style: solid;
  background: #E8EEF5;
}
.review-target {
  color: var(--purple);
  background: var(--purple-bg);
  text-decoration: underline solid 2px;
  text-underline-offset: .18em;
  border-radius: .13em; padding: 0 .04em;
}
.section-title {
  color: var(--red); font-size: 3rem; font-weight: 850;
  line-height: 1.12; max-width: 1000px;
}
.section-kicker {
  color: var(--muted); font-size: .95rem; font-weight: 800;
  letter-spacing: .12em; text-transform: uppercase; margin-bottom: 1em;
}
#progress {
  position: fixed; bottom: 19px; left: 50%;
  transform: translateX(-50%); color: var(--muted); font-size: .85rem;
}
.nav {
  position: fixed; bottom: 13px; border: 0; background: transparent;
  color: #6f777e; font-weight: 800; cursor: pointer; padding: .7em 1em;
}
.nav:disabled { opacity: .25; cursor: default; }
#back { left: 14px; }
#next { right: 14px; }
#exit {
  position: fixed; top: 12px; right: 16px; border: 0;
  background: transparent; color: #a0a6aa; font-size: 1.5rem;
  cursor: pointer;
}
.controls {
  display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
  margin: .7em 0 1.2em;
}
.choice {
  border: 2px solid var(--blue); color: var(--blue); background: white;
  border-radius: 8px; padding: .55em .9em; font-weight: 800;
  cursor: pointer;
}
.choice.selected { background: var(--blue); color: white; }
select, input[type=number] {
  border: 1px solid #adb5bc; border-radius: 7px;
  padding: .55em .7em; min-width: 220px;
}
.end-detail { color: #657078; line-height: 1.5; margin-bottom: 1.2em; }
#subset-controls {
  position: fixed;
  top: 12px;
  right: 52px;
  display: flex;
  gap: 7px;
  align-items: center;
  z-index: 20;
}
#subset-controls select,
#subset-controls button {
  font: inherit;
  font-size: .78rem;
  color: #68737c;
  background: rgba(255,255,255,.94);
  border: 1px solid #d7dde2;
  border-radius: 7px;
  padding: .42em .55em;
}
#subset-controls button {
  cursor: pointer;
  font-weight: 700;
}
#subset-controls button:hover {
  border-color: #aeb8c0;
}

@media (max-width: 700px) {
  .screen { padding: 7vh 7vw 14vh; }
  .title { font-size: 2.15rem; }
  .prompt { font-size: 2rem; }
  .answer-en { font-size: 1.02rem; }
  .answer-es { font-size: 1.9rem; }
  .section-title { font-size: 2.2rem; }
  #subset-controls {
    top: 8px;
    right: 44px;
  }
  #subset-controls select,
  #subset-controls button {
    font-size: .7rem;
    padding: .36em .45em;
  }
}

.audio-toggle {
  position: fixed;
  top: 52px;
  right: 14px;
  z-index: 25;
  font: inherit;
  font-size: .76rem;
  font-weight: 700;
  color: #68737c;
  background: rgba(255,255,255,.96);
  border: 1px solid #d7dde2;
  border-radius: 7px;
  padding: .42em .6em;
  cursor: pointer;
}

.audio-toggle.on {
  color: #355C8A;
  border-color: #9fb2c7;
  background: #eef3f8;
}

.audio-button {
  margin-top: 1.15rem;
  border: 1px solid #d7dde2;
  background: white;
  color: #5f6b75;
  border-radius: 999px;
  min-width: 44px;
  min-height: 38px;
  padding: .42em .75em;
  font-size: 1.05rem;
  cursor: pointer;
}

.audio-button:hover {
  border-color: #aeb8c0;
  background: #f7f9fb;
}

@media (max-width: 700px) {
  .audio-toggle {
    top: 48px;
    right: 8px;
    font-size: .68rem;
    padding: .36em .48em;
  }

  .audio-button {
    margin-top: .9rem;
    min-width: 42px;
    min-height: 36px;
  }
}


.cue {
  color: var(--muted); font-size: .95rem; font-weight: 500;
  margin-top: 1.25rem; line-height: 1.4;
}
#content { max-width: 100%; }
.target:focus-visible { outline: 2px solid var(--blue); outline-offset: 5px; }
#exit:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
@media (max-width: 700px) { .cue { font-size: .82rem; } }
</style>
</head>
<body>
<div id="lesson-screen" class="screen active">
  <button id="audio-toggle" class="audio-toggle" type="button" aria-pressed="false">Audio: Off</button>
  <button id="exit" type="button" aria-label="Start a new lesson">×</button>
  <div id="subset-controls">
    <select id="subset-size" aria-label="Practice set size">
      <option value="10">10 items</option>
      <option value="20" selected>20 items</option>
      <option value="30">30 items</option>
      <option value="all">All</option>
    </select>
    <button id="new-subset" type="button">New set</button>
  </div>
  <div id="content" aria-live="polite"></div>
  <button id="back" class="nav" type="button">← Back</button>
  <div id="progress"></div>
  <button id="next" class="nav" type="button">Next →</button>
</div>
<div id="end-screen" class="screen">
  <div class="title" id="end-title">Lesson complete</div>
  <div class="end-detail" id="end-detail"></div>
  <div class="controls">
    <button id="review" class="primary" type="button">Extra review</button>
    <button id="repeat" class="secondary" type="button">Repeat lesson</button>
  </div>
</div>
<script>
const DATA = __LESSON_DATA__;
const KIND = 'por_para';
const ALL_MAIN = DATA.items.filter(x => x.kind === 'main');
const ALL_REVIEWS = DATA.items.filter(x => x.kind === 'review');
const content = document.getElementById('content');
const progress = document.getElementById('progress');
const back = document.getElementById('back');
const next = document.getElementById('next');
const lessonScreen = document.getElementById('lesson-screen');
const endScreen = document.getElementById('end-screen');
const reviewBtn = document.getElementById('review');
let mode='lesson', lessonItems=[], reviewItems=[], currentIndex=0, showingAnswer=false;
let flagged=new Set(), autoAudio=false, spanishVoice=null;
function escapeHTML(x) {
 return String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;')
 .replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
}
function shuffle(x){const a=[...x];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function activeItems(){return mode==='lesson'?lessonItems:reviewItems;}
function current(){return activeItems()[currentIndex];}
function stopAudio(){if('speechSynthesis' in window)window.speechSynthesis.cancel();}
function chooseSpanishVoice(){
 if(!('speechSynthesis' in window))return null;
 const voices=(speechSynthesis.getVoices()||[]).filter(v=>String(v.lang).toLowerCase().startsWith('es'));
 spanishVoice=voices.find(v=>/^es-(mx|us|419)/i.test(v.lang))||voices.find(v=>/^es-es/i.test(v.lang))||voices[0]||null;
 return spanishVoice;
}
if('speechSynthesis' in window){chooseSpanishVoice();speechSynthesis.addEventListener?.('voiceschanged',chooseSpanishVoice);}
function speakSpanish(t){
 if(!t||!('speechSynthesis' in window))return;
 stopAudio();const u=new SpeechSynthesisUtterance(t),v=spanishVoice||chooseSpanishVoice();
 if(v){u.voice=v;u.lang=v.lang;}else{u.lang='es-MX';}u.rate=.92;u.pitch=1;speechSynthesis.speak(u);
}
function targetMarkup(item,inReview){
 const sentence=item.spanish, span=item.target_span||'';
 const at=sentence.toLocaleLowerCase().indexOf(span.toLocaleLowerCase());
 if(!span||at<0)return escapeHTML(sentence);
 const txt=escapeHTML(sentence.slice(at,at+span.length));
 const flaggedNow=flagged.has(item.stage_id);
 const el=inReview?`<span class="review-target">${txt}</span>`:
 `<span class="target${flaggedNow?' flagged':''}" role="button" tabindex="0" aria-pressed="${flaggedNow}" title="Mark for two extra examples" data-stage="${escapeHTML(item.stage_id)}">${txt}</span>`;
 return escapeHTML(sentence.slice(0,at))+el+escapeHTML(sentence.slice(at+span.length));
}
function cueFor(item){
 let cue=item.infinitive||'';
 if(item.person)cue+=`${cue?' · ':''}${item.person}`;
 return cue?`<div class="cue">${escapeHTML(cue)}</div>`:'';
}
function show(){
 const item=current();if(!item){finish();return;}
 if(!showingAnswer){
  content.innerHTML=`<div class="prompt">${escapeHTML(item.english)}</div>${cueFor(item)}`;
 }else{
  content.innerHTML=`<div class="answer-en">${escapeHTML(item.english)}</div><div class="answer-es">${targetMarkup(item,mode==='review')}</div>`;
  const b=document.createElement('button');b.className='audio-button';b.type='button';b.textContent='🔊';
  b.setAttribute('aria-label','Play Spanish audio');b.title='Play Spanish audio';
  b.disabled=!('speechSynthesis' in window);
  b.onclick=e=>{e.stopPropagation();speakSpanish(item.spanish);};content.appendChild(b);
  if(autoAudio)speakSpanish(item.spanish);
 }
 const i=currentIndex*2+(showingAnswer?2:1);
 progress.textContent=`${mode==='review'?'Review slide':'Slide'} ${i} / ${activeItems().length*2}`;
 back.disabled=currentIndex===0&&!showingAnswer;
 next.textContent=currentIndex===activeItems().length-1&&showingAnswer?'Finish →':'Next →';
 document.getElementById('subset-controls').style.display=mode==='lesson'?'flex':'none';
}
function forward(){
 stopAudio();if(!showingAnswer){showingAnswer=true;show();return;}
 if(currentIndex<activeItems().length-1){currentIndex++;showingAnswer=false;show();}else finish();
}
function backward(){
 stopAudio();if(showingAnswer){showingAnswer=false;show();}
 else if(currentIndex>0){currentIndex--;showingAnswer=true;show();}
}
// Deal topic-balanced mini-decks into interleaved order. No long sections or label cards.
function roundRobin(groups){
 const keys=shuffle(Object.keys(groups));const pools=Object.fromEntries(keys.map(k=>[k,shuffle(groups[k])]));
 const out=[];while(keys.some(k=>pools[k].length)){
  for(const k of keys)if(pools[k].length)out.push(pools[k].pop());
 }return out;
}
function drawSet(){
 const size=document.getElementById('subset-size').value;
 const n=size==='all'?ALL_MAIN.length:Math.min(Number(size),ALL_MAIN.length);
 const groups={};
 for(const item of ALL_MAIN){
  const key=KIND==='combined'?item.topic:item.preposition;
  (groups[key]??=[]).push(item);
 }
 // Group quotas are balanced for every subset; the order of groups is randomized.
 const shuffledKeys=shuffle(Object.keys(groups));const allocations=Object.fromEntries(shuffledKeys.map(k=>[k,0]));
 const chosen=Object.fromEntries(shuffledKeys.map(k=>[k,[]]));
 for(let i=0;i<n;i++){
  const eligible=shuffledKeys.filter(k=>allocations[k]<groups[k].length);
  if(!eligible.length)break;
  const least=Math.min(...eligible.map(k=>allocations[k]));
  const key=eligible.find(k=>allocations[k]===least);
  allocations[key]++;
 }
 for(const k of shuffledKeys)chosen[k]=shuffle(groups[k]).slice(0,allocations[k]);
 return roundRobin(chosen);
}
function newSet(){
 stopAudio();mode='lesson';lessonItems=drawSet();reviewItems=[];
 currentIndex=0;showingAnswer=false;flagged=new Set();
 endScreen.classList.remove('active');lessonScreen.classList.add('active');show();
}
function repeatSet(){
 stopAudio();mode='lesson';currentIndex=0;showingAnswer=false;flagged=new Set();
 endScreen.classList.remove('active');lessonScreen.classList.add('active');show();
}
function finish(){
 stopAudio();lessonScreen.classList.remove('active');endScreen.classList.add('active');
 if(mode==='review'){
  document.getElementById('end-title').textContent='Extra review complete';
  document.getElementById('end-detail').textContent=`${reviewItems.length} additional examples completed.`;
  reviewBtn.style.display='none';
 }else{
  const n=flagged.size;document.getElementById('end-title').textContent='Lesson complete';
  document.getElementById('end-detail').textContent=n?`${n} ${KIND==='combined'?'focus area':'usage category'}${n===1?'':'s'} marked for extra practice.`:'No forms were marked for extra practice.';
  reviewBtn.style.display=n?'inline-block':'none';reviewBtn.textContent=n?`Extra review: ${n*2} items`:'Extra review';
 }
}
function startReview(){
 reviewItems=shuffle([...flagged].flatMap(id=>{
  const choices=ALL_REVIEWS.filter(x=>x.stage_id===id);
  return shuffle(choices).slice(0,2);
 }));
 if(!reviewItems.length)return;
 stopAudio();mode='review';currentIndex=0;showingAnswer=false;
 endScreen.classList.remove('active');lessonScreen.classList.add('active');show();
}
function toggleTarget(stage){
 if(flagged.has(stage))flagged.delete(stage);else flagged.add(stage);
 content.querySelectorAll('.target').forEach(t=>{
  const yes=flagged.has(t.dataset.stage);t.classList.toggle('flagged',yes);t.setAttribute('aria-pressed',String(yes));
 });
}
content.addEventListener('click',e=>{
 const target=e.target.closest('.target');if(target){e.stopPropagation();toggleTarget(target.dataset.stage);return;}
 if(e.target.closest('.audio-button'))return;forward();
});
content.addEventListener('keydown',e=>{
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('.target')){
  e.preventDefault();e.stopPropagation();toggleTarget(e.target.dataset.stage);
 }
});
back.onclick=backward;next.onclick=forward;
document.getElementById('new-subset').onclick=newSet;
document.getElementById('repeat').onclick=repeatSet;
document.getElementById('review').onclick=startReview;
document.getElementById('exit').onclick=newSet;
document.getElementById('audio-toggle').onclick=()=>{
 autoAudio=!autoAudio;const b=document.getElementById('audio-toggle');
 b.textContent=autoAudio?'Audio: On':'Audio: Off';b.classList.toggle('on',autoAudio);
 b.setAttribute('aria-pressed',String(autoAudio));
 if(autoAudio&&showingAnswer&&lessonScreen.classList.contains('active'))speakSpanish(current().spanish);
 else if(!autoAudio)stopAudio();
};
document.addEventListener('keydown',e=>{
 if(!lessonScreen.classList.contains('active'))return;
 if(e.target.matches('button,select,.target'))return;
 if(['ArrowRight',' ','Enter'].includes(e.key)){e.preventDefault();forward();}
 if(e.key==='ArrowLeft'){e.preventDefault();backward();}
});
newSet();
</script>
</body>
</html>
