documentos estarán listos para el jueves.","vocab":"documents = documentos · ready = listos"},{"type":"mixed","preposition":"por","use_number":5,"use":"Means by which","hint_use":"Means by which","english":"We contacted the teacher by email.","spanish":"Contactamos al profesor por correo electrónico.","vocab":"to contact = contactar · email = correo electrónico"},{"type":"mixed","preposition":"para","use_number":6,"use":"Comparison with others or opinion","hint_use":"Comparison with others or opinion","english":"For his age, he runs fast.","spanish":"Para su edad, corre rápido.","vocab":"age = edad · to run = correr"},{"type":"mixed","preposition":"por","use_number":8,"use":"Agent (passive voice)","hint_use":"Agent (passive voice)","english":"The results were reviewed by the professor.","spanish":"Los resultados fueron revisados por el profesor.","vocab":"results = resultados · reviewed = revisados"},{"type":"mixed","preposition":"para","use_number":5,"use":"Recipient","hint_use":"Recipient","english":"This box is for the doctor.","spanish":"Esta caja es para el médico.","vocab":"box = caja · doctor = médico"},{"type":"mixed","preposition":"por","use_number":6,"use":"Exchange or substitution","hint_use":"Exchange or substitution","english":"He replaced coffee with tea.","spanish":"Reemplazó el café por té.","vocab":"to replace = reemplazar · tea = té"},{"type":"mixed","preposition":"para","use_number":4,"use":"Purpose · para + noun","hint_use":"Purpose (with a noun)","english":"This soap is for sensitive skin.","spanish":"Este jabón es para la piel sensible.","vocab":"soap = jabón · sensitive skin = piel sensible"},{"type":"mixed","preposition":"por","use_number":4,"use":"Object of a search","hint_use":"Object of a search","english":"They went to get the keys.","spanish":"Fueron por las llaves.","vocab":"to go (preterite, ellos) = fueron · keys = llaves"},{"type":"mixed","preposition":"para","use_number":7,"use":"Employment","hint_use":"Employment","english":"My aunt works for the city.","spanish":"Mi tía trabaja para la ciudad.","vocab":"aunt = tía · to work = trabajar"},{"type":"mixed","preposition":"por","use_number":7,"use":"Unit of measure","hint_use":"Unit of measure","english":"I drink four glasses of water per day.","spanish":"Bebo cuatro vasos de agua por día.","vocab":"to drink = beber · glasses = vasos · day = día"},{"type":"mixed","preposition":"para","use_number":4,"use":"Purpose · para + noun","hint_use":"Purpose (with a noun)","english":"These scissors are for arts and crafts.","spanish":"Estas tijeras son para las manualidades.","vocab":"scissors = tijeras · arts and crafts = manualidades"},{"type":"mixed","preposition":"por","use_number":1,"use":"Motion or a general location","hint_use":"Motion or a general location","english":"I walked through the plaza.","spanish":"Caminé por la plaza.","vocab":"to walk = caminar · plaza = plaza"},{"type":"mixed","preposition":"para","use_number":1,"use":"Destination","hint_use":"Destination","english":"The train leaves for Madrid tomorrow.","spanish":"El tren sale para Madrid mañana.","vocab":"train = tren · to leave = salir"},{"type":"mixed","preposition":"por","use_number":2,"use":"Duration of an action","hint_use":"Duration of an action","english":"I studied for three hours.","spanish":"Estudié por tres horas.","vocab":"to study = estudiar · hours = horas"},{"type":"mixed","preposition":"por","use_number":1,"use":"Motion or a general location","hint_use":"Motion or a general location","english":"She rides through the neighborhood on her bike.","spanish":"Va por el barrio en bicicleta.","vocab":"neighborhood = barrio · on a bike = en bicicleta"},{"type":"mixed","preposition":"por","use_number":3,"use":"Reason or motive for an action","hint_use":"Reason or motive for an action","english":"She made the sacrifice for her children.","spanish":"Hizo el sacrificio por sus hijos.","vocab":"sacrifice = sacrificio · children = hijos"}];
const q=(id)=>document.getElementById(id);
let i=0,visible=false;
function show(id,value){q(id).textContent=value ?? '';q(id).hidden=!value;}
function isAnswerSlide(s){return s.type==='practice'||s.type==='mixed';}
function render(){
  const s=SLIDES[i];
  for(const id of ['kicker','usePrep','useTitle','useGloss','english','cue','answer','hintbox','mixedTitle','mixedSubtitle'])q(id).hidden=true;
  if(s.type==='use'){
    show('usePrep',`${s.preposition.toUpperCase()} USE ${s.use_number}`);
    show('useTitle',s.title);
    show('useGloss',`(${s.gloss})`);
  }else if(s.type==='divider'){
    show('mixedTitle',s.title);
    show('mixedSubtitle',s.subtitle);
  }else{
    if(s.type==='model')show('kicker','EXAMPLE');
    if(s.type==='practice')show('kicker',`PRACTICE ${s.practice_number} / 3`);
    if(s.type==='mixed')show('kicker','MIXED PRACTICE');
    show('english',s.english);
    const answerVisible=s.type==='model'||visible;
    if(s.type==='practice'&&s.cue&&!visible)show('cue',s.cue);
    if(answerVisible)show('answer',s.spanish);
    if(s.type==='mixed'){
      q('hintbox').hidden=false;
      show('hint',`Use: ${s.hint_use||s.use}`);
      show('vocab',`Vocabulary: ${s.vocab}`);
    }
  }
  q('reveal').hidden=!isAnswerSlide(s);
  q('reveal').textContent=visible?'Hide answer':'Reveal';
  q('speak').hidden=!(s.spanish&&(s.type==='model'||visible));
  q('prev').disabled=i===0;
  q('next').disabled=i===SLIDES.length-1;
  q('counter').textContent=`${i+1} / ${SLIDES.length}`;
  q('progressbar').style.width=`${(i+1)/SLIDES.length*100}%`;
  // A hash enables direct links to specific classroom slides.
  const hash=`#${i+1}`;
  if(location.hash!==hash)history.replaceState(null,'',hash);
}
function step(n){let to=i+n;if(to<0||to>=SLIDES.length)return;i=to;visible=false;render();}
function toggle(){if(!isAnswerSlide(SLIDES[i]))return;visible=!visible;render();}
function speak(){
  const s=SLIDES[i];if(!s.spanish||!(s.type==='model'||visible)||!('speechSynthesis' in window))return;
  speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(s.spanish);utterance.lang='es-ES';utterance.rate=.86;speechSynthesis.speak(utterance);
}
function fullscreen(){if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();}else{document.exitFullscreen?.();}}
q('prev').addEventListener('click',()=>step(-1));
q('next').addEventListener('click',()=>step(1));
q('reveal').addEventListener('click',toggle);
q('speak').addEventListener('click',speak);
q('fullscreen').addEventListener('click',fullscreen);
document.addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key==='ArrowLeft'){e.preventDefault();step(-1);}
  else if(e.key==='ArrowRight'){e.preventDefault();step(1);}
  else if((e.key===' '||e.key==='Enter')&&!(e.target instanceof HTMLButtonElement)){
    e.preventDefault();if(isAnswerSlide(SLIDES[i])&&!visible)toggle();else step(1);
  }else if(e.key.toLowerCase()==='f'&&!(e.target instanceof HTMLButtonElement)){fullscreen();}
});
const initial=Number(location.hash.slice(1));if(Number.isInteger(initial)&&initial>=1&&initial<=SLIDES.length)i=initial-1;
render();
</script>
