<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lección 4 Vocabulary - Contextualized Practice</title>
<style>
:root {
  --blue: #355C8A;
  --red: #B33A3A;
  --purple: #7A5AA6;
  --purple-bg: #F1ECF7;
  --ink: #2b3035;
  --muted: #8a9299;
  --line: #e2e6e9;
  --soft: #f7f8fa;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; width: 100%; height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: white; color: var(--ink);
}
button, select, input { font: inherit; }
.screen {
  width: 100vw; height: 100vh;
  display: none; flex-direction: column;
  justify-content: center; align-items: center;
  text-align: center; padding: 7vh 8vw 12vh;
}
.screen.active { display: flex; }
.title {
  color: var(--blue); font-size: 3rem; font-weight: 800;
  line-height: 1.08; margin-bottom: .6em;
}
.subtitle {
  color: #66717a; max-width: 780px; line-height: 1.5;
  margin-bottom: 1.5em;
}
.primary {
  border: 0; background: var(--blue); color: white;
  font-weight: 800; border-radius: 9px; padding: .8em 1.4em;
  cursor: pointer;
}
.secondary {
  border: 1px solid var(--blue); background: white; color: var(--blue);
  font-weight: 800; border-radius: 9px; padding: .72em 1.2em;
  cursor: pointer;
}
.prompt {
  color: var(--blue); font-size: 3rem; font-weight: 800;
  line-height: 1.25; max-width: 1050px;
}
.answer-en {
  color: var(--blue); font-size: 1.35rem; font-weight: 650;
  margin-bottom: 1em; max-width: 1000px; line-height: 1.3;
}
.answer-es {
  color: var(--red); font-size: 2.75rem; font-weight: 800;
  line-height: 1.28; max-width: 1100px;
}
.target {
  text-decoration: underline dotted 2px;
  text-underline-offset: .18em; cursor: pointer;
  border-radius: .13em; padding: 0 .03em;
}
.target.flagged {
  text-decoration-style: solid;
  background: #E8EEF5;
}
.review-target {
  color: var(--purple);
  background: var(--purple-bg);
  text-decoration: underline solid 2px;
  text-underline-offset: .18em;
  border-radius: .13em; padding: 0 .04em;
}
.section-title {
  color: var(--red); font-size: 3rem; font-weight: 850;
  line-height: 1.12; max-width: 1000px;
}
.section-kicker {
  color: var(--muted); font-size: .95rem; font-weight: 800;
  letter-spacing: .12em; text-transform: uppercase; margin-bottom: 1em;
}
#progress {
  position: fixed; bottom: 19px; left: 50%;
  transform: translateX(-50%); color: var(--muted); font-size: .85rem;
}
.nav {
  position: fixed; bottom: 13px; border: 0; background: transparent;
  color: #6f777e; font-weight: 800; cursor: pointer; padding: .7em 1em;
}
.nav:disabled { opacity: .25; cursor: default; }
#back { left: 14px; }
#next { right: 14px; }
#exit {
  position: fixed; top: 12px; right: 16px; border: 0;
  background: transparent; color: #a0a6aa; font-size: 1.5rem;
  cursor: pointer;
}
.controls {
  display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
  margin: .7em 0 1.2em;
}
.choice {
  border: 2px solid var(--blue); color: var(--blue); background: white;
  border-radius: 8px; padding: .55em .9em; font-weight: 800;
  cursor: pointer;
}
.choice.selected { background: var(--blue); color: white; }
select, input[type=number] {
  border: 1px solid #adb5bc; border-radius: 7px;
  padding: .55em .7em; min-width: 220px;
}
.end-detail { color: #657078; line-height: 1.5; margin-bottom: 1.2em; }
#subset-controls {
  position: fixed;
  top: 12px;
  right: 52px;
  display: flex;
  gap: 7px;
  align-items: center;
  z-index: 20;
}
#subset-controls select,
#subset-controls button {
  font: inherit;
  font-size: .78rem;
  color: #68737c;
  background: rgba(255,255,255,.94);
  border: 1px solid #d7dde2;
  border-radius: 7px;
  padding: .42em .55em;
}
#subset-controls button {
  cursor: pointer;
  font-weight: 700;
}
#subset-controls button:hover {
  border-color: #aeb8c0;
}

@media (max-width: 700px) {
  .screen { padding: 7vh 7vw 14vh; }
  .title { font-size: 2.15rem; }
  .prompt { font-size: 2rem; }
  .answer-en { font-size: 1.02rem; }
  .answer-es { font-size: 1.9rem; }
  .section-title { font-size: 2.2rem; }
  #subset-controls {
    top: 8px;
    right: 44px;
  }
  #subset-controls select,
  #subset-controls button {
    font-size: .7rem;
    padding: .36em .45em;
  }
}

.audio-toggle {
  position: fixed;
  top: 52px;
  right: 14px;
  z-index: 25;
  font: inherit;
  font-size: .76rem;
  font-weight: 700;
  color: #68737c;
  background: rgba(255,255,255,.96);
  border: 1px solid #d7dde2;
  border-radius: 7px;
  padding: .42em .6em;
  cursor: pointer;
}

.audio-toggle.on {
  color: #355C8A;
  border-color: #9fb2c7;
  background: #eef3f8;
}

.audio-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-top: 1rem;
  border: 1px solid #bfc8d0;
  background: white;
  color: #4f6272;
  border-radius: 999px;
  min-height: 40px;
  padding: .48em .9em;
  font-size: .95rem;
  font-weight: 700;
  cursor: pointer;
}

.audio-button:hover {
  border-color: #aeb8c0;
  background: #f7f9fb;
}

@media (max-width: 700px) {
  .audio-toggle {
    top: 48px;
    right: 8px;
    font-size: .68rem;
    padding: .36em .48em;
  }

  .audio-button {
    margin-top: .8rem;
    min-height: 38px;
    font-size: .85rem;
  }
}

</style>
</head>

<div id="start-screen" class="screen" style="display:none">
  <div class="title">Vocabulary · Contextualized Practice</div>
  <div class="subtitle">Practice the same Lección 4 vocabulary inside short, meaningful sentences that recycle easy subjunctive patterns. Click the vocabulary target if you want two new contexts at the end.</div>

  <div class="controls">
    <select id="category">

    <button class="choice" data-n="ALL">All</button>
  </div>

  <button id="start" class="primary">Start training</button>
</div>

<div id="lesson-screen" class="screen active">
  <button id="audio-toggle" class="audio-toggle" type="button" aria-pressed="false">Audio: Off</button>
  <button id="exit">×</button>

  <div id="subset-controls">
    <select id="subset-size" aria-label="Practice set size">
      <option value="10">10 items</option>
      <option value="20">20 items</option>
      <option value="30">30 items</option>
      <option value="all" selected>All</option>
    </select>
    <button id="new-subset">New set</button>
  </div>

  <div id="content"></div>
  <button id="back" class="nav">← Back</button>
  <div id="progress"></div>
  <button id="next" class="nav">Next →</button>
</div>

<div id="end-screen" class="screen">
  <div id="end-title" class="title">Training complete</div>
  <div id="end-detail" class="end-detail"></div>
  <div class="controls">
    <button id="review" class="primary">Extra review</button>
    <button id="new" class="secondary">New session</button>
    <button id="repeat" class="secondary">Repeat this session</button>
  </div>
</div>

function escapeHTML(x) {
  return String(x)
    .replaceAll("&","&amp;").replaceAll("<","&lt;")
    .replaceAll(">","&gt;").replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function shuffle(a) {
  const x = [...a];
  for (let i = x.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [x[i], x[j]] = [x[j], x[i]];
  }
  return x;
}

function buildSession(size) {
  let pool = [...BANK];
  pool = shuffle(pool);
  if (size === "all") return pool;
  const n = Math.min(Number(size), pool.length);
  return pool.slice(0, n);
}

function startNewSubset() {
  currentSessionSize = document.getElementById("subset-size").value;
  session = buildSession(currentSessionSize);
  flagged = new Set();
  mode = "training";
  index = 0;
  showingAnswer = false;
  endScreen.classList.remove("active");
  lessonScreen.classList.add("active");
  show();
}


let autoAudio = false;
let preferredSpanishVoice = null;

function chooseSpanishVoice() {
  if (!("speechSynthesis" in window)) return null;

  const voices = window.speechSynthesis.getVoices() || [];
  const spanish = voices.filter(v =>
    String(v.lang || "").toLowerCase().startsWith("es")
  );

  preferredSpanishVoice =
    spanish.find(v => String(v.lang).toLowerCase().startsWith("es-mx")) ||
    spanish.find(v => String(v.lang).toLowerCase().startsWith("es-us")) ||
    spanish.find(v => String(v.lang).toLowerCase().startsWith("es-419")) ||
    spanish.find(v => String(v.lang).toLowerCase().startsWith("es-es")) ||
    spanish[0] ||
    null;

  return preferredSpanishVoice;
}

if ("speechSynthesis" in window) {
  chooseSpanishVoice();
  window.speechSynthesis.addEventListener?.("voiceschanged", chooseSpanishVoice);
}

function speakSpanish(text) {
  if (!text || !("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(String(text));
  const voice = preferredSpanishVoice || chooseSpanishVoice();

  if (voice) {
    utterance.voice = voice;
    utterance.lang = voice.lang;
  } else {
    utterance.lang = "es-MX";
  }

  utterance.rate = 0.92;
  utterance.pitch = 1.0;
  window.speechSynthesis.speak(utterance);
}

function updateAudioToggle() {
  const btn = document.getElementById("audio-toggle");
  if (!btn) return;

  btn.textContent = autoAudio ? "Audio: On" : "Audio: Off";
  btn.classList.toggle("on", autoAudio);
  btn.setAttribute("aria-pressed", autoAudio ? "true" : "false");
}

function addAudioButton(text) {
  const btn = document.createElement("button");
  btn.className = "audio-button";
  btn.type = "button";

  if (!("speechSynthesis" in window)) {
    btn.textContent = "🔇 Audio unavailable";
    btn.disabled = true;
    btn.title = "Audio is not supported in this browser";
    btn.setAttribute(
      "aria-label",
      "Audio is not supported in this browser"
    );
  } else {
    btn.textContent = "🔊 Hear sentence";
    btn.title = "Play the Spanish sentence";
    btn.setAttribute(
      "aria-label",
      "Play the Spanish sentence"
    );

    btn.addEventListener("click", e => {
      e.stopPropagation();
      speakSpanish(text);
    });
  }

  content.appendChild(btn);

  if (autoAudio && "speechSynthesis" in window) {
    speakSpanish(text);
  }
}

document.getElementById("audio-toggle").onclick = e => {
  e.stopPropagation();
  autoAudio = !autoAudio;
  updateAudioToggle();

  if (autoAudio && showingAnswer) {
    const item = current();
    if (item) {
      const text = mode === "training"
        ? (item.spanish_context || item.spanish)
        : item.spanish;
      speakSpanish(text);
    }
  } else if (!autoAudio && "speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }
};

updateAudioToggle();


function renderTarget(sentence, span, targetId, review=false) {
  const low = sentence.toLocaleLowerCase();
  const sl = span.toLocaleLowerCase();
  const i = low.indexOf(sl);
  if (i < 0) return escapeHTML(sentence);
  const cls = review ? "review-target" :
    ("target" + (flagged.has(targetId) ? " flagged" : ""));
  return escapeHTML(sentence.slice(0,i)) +
    `<span class="${cls}" data-target="${escapeHTML(targetId)}">` +
    escapeHTML(sentence.slice(i,i+span.length)) +
    `</span>` +
    escapeHTML(sentence.slice(i+span.length));
}

function currentItems() {
  return mode === "training" ? session : reviewItems;
}

function current() {
  return currentItems()[index];
}

function show() {
  const item = current();
  if (!item) return finish();

  const subsetControls = document.getElementById("subset-controls");
  subsetControls.style.display = mode === "training" ? "flex" : "none";

  if (!showingAnswer) {
    const promptText = mode === "training"
      ? item.english_context
      : item.english;

    content.innerHTML =
      `<div class="prompt">${escapeHTML(promptText)}</div>`;

  } else if (mode === "training") {
    content.innerHTML =
      `<div class="answer-en">${escapeHTML(item.english_context)}</div>` +
      `<div class="answer-es">${renderTarget(item.spanish_context,item.target_span,item.target_id,false)}</div>`;

    addAudioButton(item.spanish_context);

    content.querySelectorAll(".target").forEach(el => {
      el.addEventListener("click", e => {
        e.stopPropagation();
        const id = el.dataset.target;
        if (flagged.has(id)) {
          flagged.delete(id); el.classList.remove("flagged");
        } else {
          flagged.add(id); el.classList.add("flagged");
        }
      });
    });
  } else {
    content.innerHTML =
      `<div class="answer-en">${escapeHTML(item.english)}</div>` +
      `<div class="answer-es">${renderTarget(item.spanish,item.target_span,item.target_id,true)}</div>`;

    addAudioButton(item.spanish);
  }

  if (mode === "training") {
    const slideNumber = (index * 2) + (showingAnswer ? 2 : 1);
    const totalSlides = session.length * 2;
    progress.textContent = `Slide ${slideNumber} / ${totalSlides}`;
  } else {
    const slideNumber = (index * 2) + (showingAnswer ? 2 : 1);
    const totalSlides = reviewItems.length * 2;
    progress.textContent = `Review slide ${slideNumber} / ${totalSlides}`;
  }

  back.disabled = index === 0 && !showingAnswer;
}

function forward() {
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();

  if (!showingAnswer) {
    showingAnswer = true; show(); return;
  }
  if (index < currentItems().length - 1) {
    index++; showingAnswer = false; show();
  } else finish();
}

function backward() {
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();

  if (showingAnswer) {
    showingAnswer = false; show(); return;
  }
  if (index > 0) {
    index--; showingAnswer = true; show();
  }
}

function finish() {
  lessonScreen.classList.remove("active");
  endScreen.classList.add("active");
  if (mode === "training") {
    endTitle.textContent = "Training complete";
    const n = flagged.size;
    endDetail.textContent = n
      ? `${n} item${n === 1 ? "" : "s"} marked for extra practice.`
      : "No items were marked for extra practice.";
    reviewBtn.style.display = n ? "inline-block" : "none";
    reviewBtn.textContent = n ? `Extra review: ${n * 2} contexts` : "Extra review";
  } else {
    endTitle.textContent = "Extra review complete";
    endDetail.textContent = `${reviewItems.length} unseen contexts completed.`;
    reviewBtn.style.display = "none";
  }
}

function startTraining() {
  let pool = category.value === "ALL"
    ? [...BANK]
    : BANK.filter(x => x.category === category.value);

  pool = shuffle(pool);
  let n = selectedN === "ALL" ? pool.length : Math.min(Number(selectedN), pool.length);
  session = pool.slice(0,n);
  flagged = new Set();
  mode = "training"; index = 0; showingAnswer = false;
  startScreen.classList.remove("active");
  endScreen.classList.remove("active");
  lessonScreen.classList.add("active");
  show();
}

function startReview() {
  // Pull only flagged targets, then randomize the review order fresh each time.
  reviewItems = shuffle(
    REVIEW.filter(x => flagged.has(x.target_id))
  );

  if (!reviewItems.length) return;

  mode = "review";
  index = 0;
  showingAnswer = false;
  endScreen.classList.remove("active");
  lessonScreen.classList.add("active");
  show();
}

document.querySelectorAll(".choice").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".choice").forEach(x => x.classList.remove("selected"));
    btn.classList.add("selected");
    selectedN = btn.dataset.n;
  };
});

document.getElementById("start").onclick = startTraining;
reviewBtn.onclick = startReview;
document.getElementById("new").onclick = () => {
  startNewSubset();
};
document.getElementById("repeat").onclick = () => {
  mode = "training"; index = 0; showingAnswer = false;
  endScreen.classList.remove("active"); lessonScreen.classList.add("active"); show();
};
next.onclick = forward;
back.onclick = backward;
content.onclick = e => {
  if (
    e.target.closest(".target") ||
    e.target.closest(".audio-button")
  ) return;

  forward();
};
document.getElementById("exit").onclick = () => {
  index = 0;
  showingAnswer = false;
  show();
};
document.addEventListener("keydown", e => {
  if (!lessonScreen.classList.contains("active")) return;
  if (["ArrowRight"," ","Enter"].includes(e.key)) { e.preventDefault(); forward(); }
  if (e.key === "ArrowLeft") { e.preventDefault(); backward(); }
});

document.getElementById("new-subset").onclick = startNewSubset;
document.getElementById("subset-size").onchange = startNewSubset;

currentSessionSize = "all";
session = buildSession(currentSessionSize);
document.getElementById("subset-size").value = "all";
flagged = new Set();
mode = "training";
index = 0;
showingAnswer = false;
show();

</script>
</body>
</html>
