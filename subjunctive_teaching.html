<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Present Subjunctive - Forms First</title>
<style>
:root {
  --blue: #355C8A;
  --red: #B33A3A;
  --purple: #7A5AA6;
  --purple-bg: #F1ECF7;
  --ink: #2b3035;
  --muted: #8a9299;
  --line: #e2e6e9;
  --soft: #f7f8fa;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; width: 100%; height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: white; color: var(--ink);
}
button, select, input { font: inherit; }
.screen {
  width: 100vw; height: 100vh;
  display: none; flex-direction: column;
  justify-content: center; align-items: center;
  text-align: center; padding: 7vh 8vw 12vh;
}
.screen.active { display: flex; }
.title {
  color: var(--blue); font-size: 3rem; font-weight: 800;
  line-height: 1.08; margin-bottom: .6em;
}
.subtitle {
  color: #66717a; max-width: 780px; line-height: 1.5;
  margin-bottom: 1.5em;
}
.primary {
  border: 0; background: var(--blue); color: white;
  font-weight: 800; border-radius: 9px; padding: .8em 1.4em;
  cursor: pointer;
}
.secondary {
  border: 1px solid var(--blue); background: white; color: var(--blue);
  font-weight: 800; border-radius: 9px; padding: .72em 1.2em;
  cursor: pointer;
}
.prompt {
  color: var(--blue); font-size: 3rem; font-weight: 800;
  line-height: 1.25; max-width: 1050px;
}
.answer-en {
  color: var(--blue); font-size: 1.35rem; font-weight: 650;
  margin-bottom: 1em; max-width: 1000px; line-height: 1.3;
}
.answer-es {
  color: var(--red); font-size: 2.75rem; font-weight: 800;
  line-height: 1.28; max-width: 1100px;
}
.target {
  text-decoration: underline dotted 2px;
  text-underline-offset: .18em; cursor: pointer;
  border-radius: .13em; padding: 0 .03em;
}
.target.flagged {
  text-decoration-style: solid;
  background: #E8EEF5;
}
.review-target {
  color: var(--purple);
  background: var(--purple-bg);
  text-decoration: underline solid 2px;
  text-underline-offset: .18em;
  border-radius: .13em; padding: 0 .04em;
}
.section-title {
  color: var(--red); font-size: 3rem; font-weight: 850;
  line-height: 1.12; max-width: 1000px;
}
.section-kicker {
  color: var(--muted); font-size: .95rem; font-weight: 800;
  letter-spacing: .12em; text-transform: uppercase; margin-bottom: 1em;
}
#progress {
  position: fixed; bottom: 19px; left: 50%;
  transform: translateX(-50%); color: var(--muted); font-size: .85rem;
}
.nav {
  position: fixed; bottom: 13px; border: 0; background: transparent;
  color: #6f777e; font-weight: 800; cursor: pointer; padding: .7em 1em;
}
.nav:disabled { opacity: .25; cursor: default; }
#back { left: 14px; }
#next { right: 14px; }
#exit {
  position: fixed; top: 12px; right: 16px; border: 0;
  background: transparent; color: #a0a6aa; font-size: 1.5rem;
  cursor: pointer;
}
.controls {
  display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
  margin: .7em 0 1.2em;
}
.choice {
  border: 2px solid var(--blue); color: var(--blue); background: white;
  border-radius: 8px; padding: .55em .9em; font-weight: 800;
  cursor: pointer;
}
.choice.selected { background: var(--blue); color: white; }
select, input[type=number] {
  border: 1px solid #adb5bc; border-radius: 7px;
  padding: .55em .7em; min-width: 220px;
}
.end-detail { color: #657078; line-height: 1.5; margin-bottom: 1.2em; }
#subset-controls {
  position: fixed;
  top: 12px;
  right: 52px;
  display: flex;
  gap: 7px;
  align-items: center;
  z-index: 20;
}
#subset-controls select,
#subset-controls button {
  font: inherit;
  font-size: .78rem;
  color: #68737c;
  background: rgba(255,255,255,.94);
  border: 1px solid #d7dde2;
  border-radius: 7px;
  padding: .42em .55em;
}
#subset-controls button {
  cursor: pointer;
  font-weight: 700;
}
#subset-controls button:hover {
  border-color: #aeb8c0;
}

@media (max-width: 700px) {
  .screen { padding: 7vh 7vw 14vh; }
  .title { font-size: 2.15rem; }
  .prompt { font-size: 2rem; }
  .answer-en { font-size: 1.02rem; }
  .answer-es { font-size: 1.9rem; }
  .section-title { font-size: 2.2rem; }
  #subset-controls {
    top: 8px;
    right: 44px;
  }
  #subset-controls select,
  #subset-controls button {
    font-size: .7rem;
    padding: .36em .45em;
  }
}
</style>
</head>

<div id="start-screen" class="screen" style="display:none">
  <div class="title">Present Subjunctive</div>
  <div class="subtitle">Forms first, then people. Click an underlined form on an answer screen if you want two extra examples at the end.</div>
  <button id="start" class="primary">Start lesson</button>
</div>

<div id="lesson-screen" class="screen active">

      <option value="30">30 items</option>

  <div id="content"></div>
  <button id="back" class="nav">← Back</button>
  <div id="progress"></div>
  <button id="next" class="nav">Next →</button>
</div>

<div id="end-screen" class="screen">

  <div id="end-detail" class="end-detail"></div>
  <div class="controls">

function escapeHTML(x) {
  return String(x)
    .replaceAll("&","&amp;").replaceAll("<","&lt;")
    .replaceAll(">","&gt;").replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function renderTarget(sentence, span, targetId, review=false) {
  if (!span) return escapeHTML(sentence);
  const low = sentence.toLocaleLowerCase();
  const sl = span.toLocaleLowerCase();
  const i = low.indexOf(sl);
  if (i < 0) return escapeHTML(sentence);
  const cls = review ? "review-target" :
    ("target" + (flagged.has(targetId) ? " flagged" : ""));
  return escapeHTML(sentence.slice(0,i)) +
    `<span class="${cls}" data-target="${escapeHTML(targetId)}">` +
    escapeHTML(sentence.slice(i,i+span.length)) +
    `</span>` +
    escapeHTML(sentence.slice(i+span.length));
}

function buildSubset(size) {
  if (size === "all") return [...BASE_ITEMS];

  const n = Math.min(Number(size), BASE_ITEMS.length);
  const maxStart = BASE_ITEMS.length - n;
  const start = Math.floor(Math.random() * (maxStart + 1));
  return BASE_ITEMS.slice(start, start + n);
}

function startNewSubset() {
  subsetSize = document.getElementById("subset-size").value;
  lessonItems = buildSubset(subsetSize);
  mode = "lesson";
  lessonIndex = 0;
  showingAnswer = false;
  flagged = new Set();
  endScreen.classList.remove("active");
  lessonScreen.classList.add("active");
  show();
}

function activeItems() {
  return mode === "lesson" ? lessonItems : reviewItems;
}

function activeIndex() {
  return mode === "lesson" ? lessonIndex : reviewIndex;
}

function setIndex(n) {
  if (mode === "lesson") lessonIndex = n;
  else reviewIndex = n;
}

function current() {
  return activeItems()[activeIndex()];
}

function show() {
  const item = current();
  if (!item) return finish();

  content.innerHTML = "";

  if (!showingAnswer) {
    content.innerHTML = `<div class="prompt">${escapeHTML(item.english)}</div>`;
  } else {
    const isReview = mode === "review";
    const targetId = isReview ? item.stage_id : item.stage_id;
    content.innerHTML =
      `<div class="answer-en">${escapeHTML(item.english)}</div>` +
      `<div class="answer-es">${renderTarget(item.spanish,item.target_span,targetId,isReview)}</div>`;

    if (!isReview && item.clickable) {
      content.querySelectorAll(".target").forEach(el => {
        el.addEventListener("click", e => {
          e.stopPropagation();
          const id = el.dataset.target;
          if (flagged.has(id)) {
            flagged.delete(id);
            el.classList.remove("flagged");
          } else {
            flagged.add(id);
            el.classList.add("flagged");
          }
        });
      });
    }
  }

  const subsetControls = document.getElementById("subset-controls");

  if (mode === "lesson") {
    subsetControls.style.display = "flex";
    const slideNumber = (lessonIndex * 2) + (showingAnswer ? 2 : 1);
    const totalSlides = lessonItems.length * 2;
    progress.textContent = `Slide ${slideNumber} / ${totalSlides}`;
  } else {
    subsetControls.style.display = "none";
    const reviewSlide = (reviewIndex * 2) + (showingAnswer ? 2 : 1);
    const totalReviewSlides = reviewItems.length * 2;
    progress.textContent = `Review slide ${reviewSlide} / ${totalReviewSlides}`;
  }

  back.disabled = activeIndex() === 0 && !showingAnswer;
}

function forward() {
  const item = current();
  if (!item) return finish();

  if (!showingAnswer) {
    showingAnswer = true;
    show();
    return;
  }

  if (activeIndex() < activeItems().length - 1) {
    setIndex(activeIndex() + 1);
    showingAnswer = false;
    show();
  } else {
    finish();
  }
}

function backward() {
  const item = current();
  if (showingAnswer) {
    showingAnswer = false;
    show();
    return;
  }
  if (activeIndex() > 0) {
    setIndex(activeIndex() - 1);
    showingAnswer = true;
    show();
  }
}

function finish() {
  lessonScreen.classList.remove("active");
  endScreen.classList.add("active");

  if (mode === "lesson") {
    endTitle.textContent = "Lesson complete";
    const n = flagged.size;
    endDetail.textContent = n
      ? `${n} grammatical area${n === 1 ? "" : "s"} marked for extra practice.`
      : "No forms were marked for extra practice.";
    reviewBtn.style.display = n ? "inline-block" : "none";
    reviewBtn.textContent = n ? `Extra review: ${n * 2} items` : "Extra review";
  } else {
    endTitle.textContent = "Extra review complete";
    endDetail.textContent = `${reviewItems.length} unseen examples completed.`;
    reviewBtn.style.display = "none";
  }
}

function startReview() {
  reviewItems = [];
  flagged.forEach(id => {
    (REVIEW[id] || []).forEach(x => reviewItems.push(x));
  });

  // Fresh randomized order every time extra review starts.
  for (let i = reviewItems.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [reviewItems[i], reviewItems[j]] = [reviewItems[j], reviewItems[i]];
  }
  if (!reviewItems.length) return;
  mode = "review";
  reviewIndex = 0;
  showingAnswer = false;
  endScreen.classList.remove("active");
  lessonScreen.classList.add("active");
  show();
}

document.getElementById("start").onclick = () => {
  mode = "lesson"; lessonIndex = 0; showingAnswer = false; flagged = new Set();
  startScreen.classList.remove("active"); lessonScreen.classList.add("active"); show();
};
next.onclick = forward;
back.onclick = backward;
content.onclick = e => {
  if (e.target.closest(".target")) return;
  forward();
};
reviewBtn.onclick = startReview;
document.getElementById("repeat").onclick = () => {
  mode = "lesson"; lessonIndex = 0;
  while (lessonIndex < LESSON.length && LESSON[lessonIndex].kind === "section") {
    lessonIndex++;
  }
  showingAnswer = false;
  endScreen.classList.remove("active"); lessonScreen.classList.add("active"); show();
};
document.getElementById("exit").onclick = () => {
  mode = "lesson";
  lessonIndex = 0;
  while (lessonIndex < LESSON.length && LESSON[lessonIndex].kind === "section") {
    lessonIndex++;
  }
  showingAnswer = false;
  show();
};
document.addEventListener("keydown", e => {
  if (!lessonScreen.classList.contains("active")) return;
  if (["ArrowRight"," ","Enter"].includes(e.key)) { e.preventDefault(); forward(); }
  if (e.key === "ArrowLeft") { e.preventDefault(); backward(); }
});

lessonItems = buildSubset("all");
mode = "lesson";
lessonIndex = 0;
showingAnswer = false;
flagged = new Set();
show();

</script>
</body>
</html>
